<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css-flex</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <!-- Block elements-->
    <div style="background: lightblue; padding: 8px;"> I am a block element(div)</div>
    <p style="background: lightyellow; padding: 8px;"> I am aslo a block element(p)</p>
    <!-- Inline elements -->
    <p>I have <span style="background: lightgreen;">an inline span</span> and <a href="#"> an inline link</a> inside me</p>

    <!--Inline-block element-->
    <p>
        <span style="display: inline-block; width: 80px; height: 80px;
           background: coral; text-align: center; 
           line-height: 80px;">Box 1</span>
        <span style="display: inline-block; width: 80px; height: 80px;
            background: gold; text-align: center;
            line-height: 80px;">Box 2</span>
        <span style="display: inline-block; width: 80px; height: 80px;
            background: plum; text-align: center;
            line-height: 80px; "> Box 3</span>
    </p>
</body>

</html>
